requisitos_funcionais:
  modulo_produto:
    - id: RF001
      prioridade: Alta
      nome: Cadastro de produtos com fotos
      descricao: O sistema deve permitir o cadastro de produtos com fotos em alta resolução.
      rastreabilidade_rn: [RN003]

    - id: RF002
      prioridade: Alta
      nome: Exibição de especificações técnicas
      descricao: O sistema deve exibir descrições detalhadas e especificações técnicas (dimensão, peso, material) de cada produto.
      rastreabilidade_rn: [RN002, RN003]

    - id: RF003
      prioridade: Média
      nome: Categorização de produtos
      descricao: O sistema deve permitir a categorização de produtos por tipo (elétrico, hidráulico, pisos), marca, cor e aplicação.

    - id: RF004
      prioridade: Média
      nome: Venda por diferentes unidades
      descricao: O sistema deve permitir a venda de produtos por diferentes unidades de medida (unidade, metro quadrado, caixa, kilo, litro) e criar tabelas de unidades.
      rastreabilidade_rn: [RN001]

    - id: RF005
      prioridade: Alta
      nome: CRUD completo de produtos por Admin
      descricao: O sistema deve permitir que o administrador inclua, altere, exclua e gerencie informações detalhadas dos produtos, como nome, descrição, preço, imagens de qualidade, vídeos, SKUs e peso.

    - id: RF006
      prioridade: Alta
      nome: Gestão automatizada de inventário
      descricao: O software deve gerenciar automaticamente o inventário, atualizando a disponibilidade do produto em tempo real à medida que as vendas ocorrem e permitindo a consulta de saldo ou estoque.
      rastreabilidade_rn: [RN005]

  modulo_compra:
    - id: RF007
      prioridade: Baixa
      nome: Criação de kits/combos
      descricao: O sistema deve permitir a criação de kits ou "combos" de produtos.
      rastreabilidade_rn: [RN004]

    - id: RF008
      prioridade: Baixa
      nome: Sugestões de produtos relacionados
      descricao: O sistema deve apresentar sugestões de produtos relacionados para incentivar compras adicionais.

    - id: RF009
      prioridade: Alta
      nome: Gestão do carrinho de compras
      descricao: O sistema deve ter um carrinho de compras que permite adicionar, remover e alterar a quantidade de itens.

    - id: RF010
      prioridade: Alta
      nome: Cálculo dinâmico de frete
      descricao: O sistema deve calcular o frete com base no peso, volume e endereço de entrega.
      rastreabilidade_rn: [RN002, RN007, RN008]

    - id: RF011
      prioridade: Média
      nome: Busca eficiente e filtros
      descricao: O site deve oferecer uma barra de busca eficiente e filtros (por preço, categoria, marca, atributos) para ajudar os usuários.

    - id: RF012
      prioridade: Média
      nome: Página dedicada do produto
      descricao: Cada produto deve ter uma página dedicada com informações completas, imagens ampliáveis e opções de seleção de variações.

    - id: RF013
      prioridade: Baixa
      nome: Avaliações e comentários (Opcional)
      descricao: Permitir que os clientes avaliem e comentem sobre os produtos para aumentar a confiança e credibilidade.

  modulo_usuario:
    - id: RF014
      prioridade: Alta
      nome: Cadastro e Autenticação
      descricao: O sistema deve permitir o cadastro de usuários e o login com e-mail/senha ou redes sociais.

    - id: RF015
      prioridade: Baixa
      nome: Recuperação de senha
      descricao: O sistema deve permitir a recuperação de senha.

    - id: RF016
      prioridade: Alta
      nome: Histórico de pedidos
      descricao: O sistema deve armazenar o histórico de pedidos para cada usuário.

    - id: RF017
      prioridade: Baixa
      nome: Múltiplos endereços de entrega
      descricao: O sistema deve permitir que o usuário salve diferentes endereços de entrega.

  modulo_pagamento:
    - id: RF018
      prioridade: Alta
      nome: Múltiplas opções de pagamento
      descricao: O sistema deve oferecer múltiplas opções de pagamento (cartão de crédito, boleto, PIX).
      rastreabilidade_rn: [RN016]

    - id: RF019
      prioridade: Baixa
      nome: Integração com gateway seguro
      descricao: O sistema deve integrar-se com um sistema de pagamento seguro.

    - id: RF020
      prioridade: Alta
      nome: Emissão de Nota Fiscal Eletrônica (NF-e)
      descricao: O sistema deve emitir nota fiscal eletrônica.
      rastreabilidade_rn: [RN012]

  modulo_logistica:
    - id: RF021
      prioridade: Média
      nome: Opções de modalidade de entrega
      descricao: O sistema deve oferecer opções de entrega (retirada na loja, entrega padrão).
      rastreabilidade_rn: [RN008]

    - id: RF022
      prioridade: Média
      nome: Rastreamento de pedido
      descricao: O sistema deve permitir o acompanhamento do status do pedido e da entrega.
      rastreabilidade_rn: [RN013]

  modulo_administracao:
    - id: RF023
      prioridade: Alta
      nome: Gestão de catálogo e preços
      descricao: O sistema deve permitir ao administrador gerenciar o catálogo de produtos e preços.
      rastreabilidade_rn: [RN017, RN018]

    - id: RF024
      prioridade: Baixa
      nome: Painel de alerta de baixo estoque
      descricao: O sistema deve ter um painel de controle de estoque para alertar sobre produtos com baixa quantidade.
      rastreabilidade_rn: [RN006]

    - id: RF025
      prioridade: Média
      nome: Relatórios gerenciais
      descricao: O sistema deve permitir a emissão de relatórios de vendas e desempenho.
